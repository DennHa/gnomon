<svg width="660" height="452" viewBox="0 0 660 452" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Finder sizes the window to this picture, title bar included, so the visible part is 660×420.
     The last 32 points are hidden behind that: keep everything that matters above y=420. -->
<defs>
<linearGradient id="shadow" x1="404" y1="0" x2="516" y2="0" gradientUnits="userSpaceOnUse">
<stop stop-color="#13181C" stop-opacity="0.85"/>
<stop offset="1" stop-color="#13181C" stop-opacity="0.35"/>
</linearGradient>
<linearGradient id="iconBg" x1="0" y1="0" x2="232" y2="452" gradientUnits="userSpaceOnUse">
<stop stop-color="#282B30"/>
<stop offset="1" stop-color="#13181C"/>
</linearGradient>
<clipPath id="panel"><rect width="232" height="452"/></clipPath>
</defs>

<!-- Paper -->
<rect width="660" height="452" fill="#F6F1E4"/>

<!-- Left panel: the app icon itself, large and cropped -->
<g clip-path="url(#panel)">
<rect width="232" height="452" fill="url(#iconBg)"/>
<g transform="translate(-89 -157.5) scale(0.5)">
<path d="M500 764H621M743 764H864M985 764H1046" stroke="#0E1113" stroke-width="90" stroke-linecap="round"/>
<path d="M318 764H379" stroke="#0E1113" stroke-width="90" stroke-linecap="round"/>
<path d="M318 763L701 260" stroke="#FFFD50" stroke-width="90" stroke-linecap="round"/>
</g>
</g>
<rect x="232" width="1" height="452" fill="#0E1113"/>

<!-- Title -->
<text x="272" y="84" fill="#0E1113" font-family="system-ui, -apple-system" font-size="46" font-weight="700" letter-spacing="-1">Gnomon</text>

<!-- The rule is a piece of day: a sun on an hour scale -->
<path d="M272 106H624" stroke="#0E1113" stroke-opacity="0.45"/>
<path d="M314 103V109M356 103V109M398 103V109M440 103V109M482 103V109M524 103V109M566 103V109M608 103V109" stroke="#0E1113" stroke-opacity="0.45"/>
<circle cx="272" cy="106" r="5.5" fill="#F5B400"/>
<text x="272" y="130" fill="#6B6557" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" letter-spacing="0.2">09:00 · Start day</text>

<!-- Soft tile behind the app icon -->
<rect x="272" y="162" width="124" height="124" rx="24" fill="#0E1113" fill-opacity="0.07"/>

<!-- The arrow: the sundial's shadow, thinning as it falls towards Applications, with hour ticks under it -->
<path d="M404 208V224H506L404 208Z" fill="url(#shadow)"/>
<path d="M404 224H514" stroke="#0E1113" stroke-opacity="0.6"/>
<path d="M512 219.5L521 224L512 228.5Z" fill="#0E1113"/>
<path d="M404 224V231M422 224V228M440 224V228M458 224V231M476 224V228M494 224V228" stroke="#0E1113" stroke-opacity="0.6"/>

<!-- First start, where the Applications step ends -->
<text x="624" y="318" text-anchor="end" fill="#8A5A00" font-family="system-ui, -apple-system" font-size="11.5" font-weight="500">First start blocked by macOS?</text>
<text x="624" y="333" text-anchor="end" fill="#8A5A00" font-family="system-ui, -apple-system" font-size="11.5" font-weight="500">Privacy &amp; Security, then Open Anyway</text>

<!-- Bottom line -->
<path d="M272 352H624" stroke="#0E1113" stroke-opacity="0.45"/>
<text x="272" y="378" fill="#6B6557" font-family="system-ui, -apple-system" font-size="11" font-weight="500" letter-spacing="1.8">DRAG ONTO APPLICATIONS TO INSTALL</text>
</svg>
